<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Produkt</title>
</head>

<body>

    <header>

        <!-- Logo eller navn -->
        <a href="index.html" class="logo">Hjem</a>

        <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="index.html">Kategorier</a></li>
                <li><a href="produktliste.html">Produkter</a></li>
                <li><a href="#">Indkøbskurv</a></li>
            </ul>
        </nav>

    </header>


    <main>

        <div class="product">

            <!-- Produktbillede -->
            <div class="product_image">
                <img src="img/IMG_0420.png" alt="Basic T-shirt">
            </div>


            <!-- Produktinformation -->
            <div class="product_info">

                <p class="product_brand">Label</p>

                <h1>Skjorte</h1>

                <p class="product_category">Hvid</p>

                <p class="product_price">499 kr.</p>

                <p class="product_description">
                    En klassisk og enkel skjorte i et behageligt materiale.
                    Perfekt til hverdagsbrug og nem at kombinere med resten
                    af garderoben.
                </p>


                <!-- Størrelse -->
                <div class="sizes">

                    <h3>Vælg størrelse</h3>

                    <button>XS</button>
                    <button>S</button>
                    <button>M</button>
                    <button>L</button>
                    <button>XL</button>

                </div>


                <!-- Køb -->
                <button class="buy_button">
                    Læg i kurv
                </button>

            </div>

        </div>

    </main>

</body>

</html>

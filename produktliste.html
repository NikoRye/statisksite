<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">

<body>

    <header>

        <a href="index.html" class="logo">Hjem</a>

            <a href="produkt.html">

            <a href="produkt.html">

                    <h3>blazer</h3>

            <a href="produkt.html">
                <article class="card sale">
